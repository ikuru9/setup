# ~/.omp/agent/config.yml

modelRoles:
  # 기본 구현, 디버깅, 리팩터링에 사용하는 주력 모델
  default: openai-codex/gpt-5.6-sol:medium

  # 독립적으로 위임되는 일반 작업용 모델
  # 기본 모델보다 빠른 Terra를 사용해 병렬 작업 비용을 줄임
  task: openai-codex/gpt-5.6-terra:medium

  # 구조 설계, 마이그레이션, 복잡한 작업 계획용
  plan: openai-codex/gpt-5.6-sol:high

  # 높은 정확도가 필요한 어려운 작업으로 수동 전환할 때 사용
  slow: openai-codex/gpt-5.6-sol:high

  # UI 구성, CSS, 반응형 설계, 접근성 검토용
  designer: openai-codex/gpt-5.6-terra:high

  # 스크린샷, 디자인 시안 등 시각 자료 분석용
  vision: openai-codex/gpt-5.6-terra:medium

  # 작업 결과를 독립적으로 검토하는 advisor 역할
  # 현재 advisor 자체는 아래에서 자동 활성화하지 않았으므로
  # 필요한 경우 명시적으로 호출할 때 사용됨
  advisor: openai-codex/gpt-5.6-terra:high

  # 검색, 요약, 단순 파일 탐색 등 가벼운 작업용
  smol: openai-codex/gpt-5.6-luna:low

  # 제목 생성 등 매우 단순한 내부 작업용
  tiny: openai-codex/gpt-5.6-luna:low

  # 커밋 메시지 생성용
  commit: openai-codex/gpt-5.6-luna:low

# 작업 복잡도에 따라 thinking level을 자동 선택
# 기본값과 다를 수 있으므로 의도적으로 유지
defaultThinkingLevel: auto

tools:
  # 파일 읽기와 workspace 내부 수정은 자동 승인
  # Bash 등 실행 계열은 원칙적으로 별도 승인이 필요한 모드
  approvalMode: write

  approval:
    # 일반 Bash 명령은 자동 실행
    # 아래 bash.patterns에 걸리는 위험 명령만 다시 승인 요청
    bash: allow

bash:
  autoBackground:
    # dev server, watch, 장시간 테스트 등을 자동 background 처리
    # threshold는 기본값을 사용
    enabled: true

  patterns:
    # 원격 저장소에 변경 사항을 전송하므로 승인 요청
    - match: "git push *"
      approval: prompt

    # 작업 내용을 강제로 되돌릴 수 있으므로 승인 요청
    - match: "git reset --hard *"
      approval: prompt

    # untracked 파일과 디렉터리를 삭제할 수 있으므로 승인 요청
    - match: "git clean *"
      approval: prompt

    # 커밋 이력을 재작성할 수 있으므로 승인 요청
    - match: "git rebase *"
      approval: prompt

    # npm registry 배포 명령
    - match: "npm publish *"
      approval: prompt

    # pnpm registry 배포 명령
    - match: "pnpm publish *"
      approval: prompt

    # Yarn Berry의 npm publish 명령
    - match: "yarn npm publish *"
      approval: prompt

    # 관리자 권한 실행은 항상 승인 요청
    - match: "sudo *"
      approval: prompt

    # 사용하지 않는 Docker 리소스를 광범위하게 삭제할 수 있음
    - match: "docker system prune *"
      approval: prompt

    # 영구 데이터가 저장된 Docker volume 삭제 가능
    - match: "docker volume rm *"
      approval: prompt

bashInterceptor:
  # cat, grep 등 일부 셸 명령을 OMP 내장 도구로 유도
  # 불필요한 Bash 실행을 줄이고 도구 출력을 구조화함
  enabled: true

lsp:
  # 기존 파일을 부분 수정한 직후에도 LSP diagnostics 실행
  # TypeScript 오류를 빨리 잡지만 대형 모노레포에서는 지연될 수 있음
  diagnosticsOnEdit: true

retry:
  # 한 요청에서 지나치게 오래 재시도하지 않도록 제한
  maxRetries: 3

  # 재시도 사이의 최대 대기 시간을 30초로 제한
  maxDelayMs: 30000

eval:
  # JavaScript eval은 기본값을 그대로 사용
  py: false

statusLine:
  # 기본 preset 대신 표시할 segment를 직접 지정
  preset: custom

  # 얇은 Powerline 구분자 사용
  # Nerd Font가 설치되어 있어야 가장 정상적으로 표시됨
  separator: powerline-thin

  leftSegments:
    # 현재 모델과 thinking level
    - model

    # plan, loop 등 현재 실행 모드
    # 일반 모드에서는 표시가 없거나 짧게 표시될 수 있음
    - mode

    # 현재 프로젝트 경로
    - path

    # 현재 Git 브랜치와 변경 상태
    - git

  rightSegments:
    # 5시간 및 7일 사용률과 초기화까지 남은 시간
    # 퍼센트는 남은 양이 아니라 사용한 양으로 표시될 수 있음
    - usage

    # 현재 context window 사용률
    - context_pct

  segmentOptions:
    model:
      # 모델명 옆에 medium, high 등의 thinking level 표시
      showThinkingLevel: true

    path:
      # 긴 경로를 축약해서 status line 공간 절약
      abbreviate: true

      # 표시할 경로의 최대 길이
      maxLength: 32

      # OMP work directory 접두 경로를 제거해 프로젝트명 중심으로 표시
      stripWorkPrefix: true

# Nerd Font 아이콘과 심볼 사용
# 터미널 폰트가 Nerd Font가 아니면 문자가 깨질 수 있음
symbolPreset: nerd

theme:
  # 밝은 터미널 환경에서 사용하는 테마
  light: light-catppuccin

  # 어두운 터미널 환경에서 사용하는 테마
  dark: dark-catppuccin

# OMP 초기 설정 마이그레이션 버전
# setup 과정에서 생성된 값이므로 특별한 이유가 없으면 유지
setupVersion: 1
