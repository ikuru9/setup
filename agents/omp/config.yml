modelRoles:
  default: openai-codex/gpt-5.6-sol:xhigh
  task: openai-codex/gpt-5.6-luna:xhigh
  plan: openai-codex/gpt-5.6-sol:high
  slow: openai-codex/gpt-5.6-luna:max
  designer: openai-codex/gpt-5.6-luna:max
  vision: openai-codex/gpt-5.6-luna:high
  advisor: openai-codex/gpt-5.6-sol:medium
  tiny: openai-codex/gpt-5.6-luna:high
  commit: openai-codex/gpt-5.6-luna:xhigh
  smol: openai-codex/gpt-5.6-luna:max
defaultThinkingLevel: auto
tools:
  approvalMode: write
  approval:
    bash: allow
bash:
  autoBackground:
    enabled: true
  patterns:
    - match: git push *
      approval: prompt
    - match: git reset --hard *
      approval: prompt
    - match: git clean *
      approval: prompt
    - match: git rebase *
      approval: prompt
    - match: npm publish *
      approval: prompt
    - match: pnpm publish *
      approval: prompt
    - match: yarn npm publish *
      approval: prompt
    - match: sudo *
      approval: prompt
    - match: docker system prune *
      approval: prompt
    - match: docker volume rm *
      approval: prompt
bashInterceptor:
  enabled: true
lsp:
  diagnosticsOnEdit: true
retry:
  maxRetries: 3
  maxDelayMs: 30000
eval:
  py: false
statusLine:
  preset: custom
  separator: powerline-thin
  leftSegments:
    - model
    - mode
    - time_spent
    - usage
    - pr
  rightSegments:
    - context_pct
    - token_rate
    - cost
    - token_total
    - token_in
    - token_out
    - cache_hit
    - path
  segmentOptions:
    model:
      showThinkingLevel: true
    path:
      abbreviate: true
      maxLength: 32
      stripWorkPrefix: true
symbolPreset: nerd
theme:
  light: light-catppuccin
  dark: dark-catppuccin
setupVersion: 2
dev:
  autoqaConsent: granted
advisor:
  enabled: false
prewalk:
  enabled: true
cycleOrder:
  - default
  - plan
  - task
